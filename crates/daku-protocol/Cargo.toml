[package]
name = "daku-protocol"
version = "0.1.0"
edition = "2024"
description = "Versioned, transport-neutral wire contract shared by daku clients and daemon"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
