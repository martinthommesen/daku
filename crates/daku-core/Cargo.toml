[package]
name = "daku-core"
version = "0.1.0"
edition = "2024"
description = "Headless provider, persistence, and workspace runtime for daku"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
dirs = "6.0"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
daku-protocol = { path = "../daku-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
uuid = { version = "1.18", features = ["v4", "serde"] }
