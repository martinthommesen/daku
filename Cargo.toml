[package]
name = "daku"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "macOS operator console for ServiceNow Environments"
license = "GPL-3.0-only"

[workspace]
members = [
    "crates/daku-client",
    "crates/daku-core",
    "crates/daku-daemon",
    "crates/daku-protocol",
]
default-members = [
    ".",
    "crates/daku-client",
    "crates/daku-core",
    "crates/daku-daemon",
    "crates/daku-protocol",
]
resolver = "2"

[dependencies]
anyhow = "1.0"
# Prefer upstream Zed GPUI after browser/WKWebView strip (plan 001).
# The zed sha is pinned in Cargo.lock only — gpui-component depends on
# `gpui = { git = zed }` with no rev, and Cargo treats `git+zed?rev=X` and
# `git+zed` as different sources (ADR-0008). Bump with
# `cargo update -p gpui-component --precise <rev>` (also
# `-p gpui-component-assets`) then `cargo update -p gpui --precise <zed sha
# from gpui-component's Cargo.lock at that rev>`, and re-run `bun run check`.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "972a3ebfd01afca7da6d8b6f31c9a51288ea5565" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "972a3ebfd01afca7da6d8b6f31c9a51288ea5565" }
libc = "0.2"
serde_json = "1.0"
daku-client = { path = "crates/daku-client" }
daku-protocol = { path = "crates/daku-protocol" }

[features]
channel-homebrew = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSCell",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSLocale",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
