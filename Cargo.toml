[package]
name = "daku"
version = "0.1.0"
edition = "2024"
description = "macOS operator console for ServiceNow Environments"
license = "GPL-3.0-only"

[workspace]
members = [
    "crates/daku-client",
    "crates/daku-core",
    "crates/daku-daemon",
    "crates/daku-protocol",
]
default-members = [
    ".",
    "crates/daku-client",
    "crates/daku-core",
    "crates/daku-daemon",
    "crates/daku-protocol",
]
resolver = "2"

[dependencies]
anyhow = "1.0"
# Prefer upstream Zed GPUI after browser/WKWebView strip (plan 001).
# Pinned to the commit Cargo.lock resolved; bump `rev` on both lines
# together and re-run `bun run check`.
gpui = { git = "https://github.com/zed-industries/zed", rev = "db7c1d38c8e17e9d4f01c35179c847fcd5bfa09b" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "db7c1d38c8e17e9d4f01c35179c847fcd5bfa09b", features = [
    "font-kit",
] }
libc = "0.2"
serde_json = "1.0"
daku-client = { path = "crates/daku-client" }
daku-protocol = { path = "crates/daku-protocol" }
rust-i18n = "4"

[features]
channel-homebrew = []

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSCell",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSLocale",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
# Not imported directly, but needed to enable `objc2-core-graphics` on
# objc2-quartz-core (gates CALayer::setBackgroundColor, used in platform.rs).
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# `block` 0.1.6 declares an extern static with an uninhabited type. This fork
# is the crates.io release plus the future-incompatibility fix only.
[patch.crates-io]
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
